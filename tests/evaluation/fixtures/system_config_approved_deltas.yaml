deltas:
  evermemos_cloud_api:
    - pointer: /search/timeout_seconds
      classification: behavior-fix
      surface: effective
      rationale: The harness now enforces the existing 300-second per-attempt search timeout.
  memos:
    - pointer: /request_interval
      classification: behavior-fix
      surface: raw
      rationale: Removed the legacy interval field because MemosAdapter never consumed it.
    - pointer: /requests_per_second
      classification: behavior-fix
      surface: raw
      rationale: Declared the adapter-consumed field at the existing ten-requests-per-second runtime rate.
    - pointer: /requests_per_second
      classification: behavior-fix
      surface: effective
      rationale: The effective config now exposes the adapter-consumed ten-requests-per-second limit without changing runtime behavior.
