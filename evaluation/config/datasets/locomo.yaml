# LoCoMo Dataset Configuration

name: "locomo"
version: "1.0"
description: "Long-Context Modeling benchmark for conversational memory"

# Memory language setting (overrides MEMORY_LANGUAGE env var)
memory_language: "en"

# Data configuration
data:
  path: "locomo/locomo10.json"  # Relative to evaluation/data/ or project root data/
  format: "locomo"  # Native format, no conversion needed

# Evaluation configuration
evaluation:
  type: "llm_judge"  # llm_judge | exact_match
  
  # LLM Judge settings.
  # Judge LLM aligned with OpenViking official openclaw-eval/README which uses
  # doubao-seed-2-0-pro-260215 on volces.com — we route the same model through
  # sophnet so the judge stack matches OV's reference setup. Agent-side LLM
  # (see system yamls) uses the same model so judge ↔ agent decisions stay
  # on equal footing.
  llm:
    provider: "openai"
    model: "doubao-seed-2-0-pro-260215"
    api_key: "${LLM_API_KEY}"
    base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  
  num_runs: 3  # Number of judging runs per question

  # Stage 4 throughput. Total in-flight judge calls = N_keys × per-key budget.
  # Full10 base (1540 q × 3 runs = 4620 calls) at the historical default
  # per_key=4 with 4 LLM_API_KEY[_N] env keys → 16 in-flight, 35min on smoke3
  # (≈0.55 call/s wall, ~29s per call). Raising per_key to 16 with 4 keys →
  # 64 in-flight, expected ~4× speedup on Stage 4 (~9min smoke3) without
  # affecting acc (concurrency only changes wall time, not judge content).
  # If sophnet returns 429 storm in pipeline.log, lower this value.
  judge_concurrency_per_key: 16

  # Filter settings
  # LoCoMo categories: "1", "2", "3", "5" (adversarial questions)
  filter_category: [5]  # Can use integers or strings, like [5] or ["5"]

