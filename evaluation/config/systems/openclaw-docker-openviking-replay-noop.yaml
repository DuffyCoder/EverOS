# OV-only on LoCoMo via per-message agent_run replay.
#
# Wiring (B2 — noop memory slot, OV owns all retrieval):
#   * memory_mode=noop disables OpenClaw memorySearch; the agent has no
#     memory_search/memory_get tools. All recall goes through OV plugin's
#     before_prompt_build hook.
#   * context_engine_mode=openviking puts the OV plugin in the
#     contextEngine slot. afterTurn captures every turn into the OV
#     backend, before_reset triggers commitOVSession finalization.
#
# Ingest = per-message agent_run replay through gateway. OV plugin's
# afterTurn fires for each turn (production path), accumulating into OV.
#
# Prerequisites at run time:
#   * OpenViking server running on the host at port 1933 (or wherever
#     OPENVIKING_BASE_URL points). The plugin uses
#     host.docker.internal:1933 inside the container; add_host_gateway
#     bridges that to the host machine.
#   * OPENVIKING_API_KEY exported in the host process env when running
#     the eval CLI; passed through via the agent_llm.env_vars whitelist.
#
# Image: built by build.py with --memory-plugin noop --context-engine
# openviking. The same image works for the memcore variant below
# because memory_mode is selected at runtime via env, not baked in.
adapter: "openclaw-docker"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  temperature: 0.0
  max_tokens: 1024

search:
  top_k: 6
  response_top_k: 5
  num_workers: 5
  max_inflight_queries_per_conversation: 1

answer:
  max_retries: 3
  max_concurrent: 4

openclaw:
  repo_path: "${OPENCLAW_REPO_PATH}"
  visibility_mode: "settled"
  retrieval_route: "search_then_get"
  backend_mode: "fts_only"            # OV owns retrieval; OpenClaw memorySearch off
  flush_mode: "agent_replay"
  answer_mode: "agent_local"
  memory_mode: "noop"
  context_engine_mode: "openviking"
  context_engine_ingest_mode: "all"   # opt-in to OV afterTurn capture
  agent_timeout_seconds: 90
  agent_llm:
    provider_id: "sophnet"
    base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
    api: "openai-completions"
    api_key_env: "LLM_API_KEY"
    env_vars:
      - "LLM_API_KEY"
      - "LLM_BASE_URL"
      - "LLM_MODEL"
      - "SOPH_API_KEY"
      - "SOPH_EMBED_URL"
      - "SOPH_EMBED_EASYLLM_ID"
      - "OPENVIKING_BASE_URL"
      - "OPENVIKING_API_KEY"
      - "OPENVIKING_AGENT_PREFIX"
    model:
      id: "gpt-4.1-mini"
      name: "GPT 4.1 Mini (sophnet)"
      reasoning: false
      input: ["text"]
      cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      context_window: 128000
      max_tokens: 4096
  prompts:
    memory_mode: "native_compiled"
    flush_mode: "agent_replay"
    answer_mode: "shared"

openclaw_docker:
  image: "openclaw-eval:7da23c3-openviking-b7e6bcb-slim"
  max_concurrent_containers: 4
  mem_limit: "2g"
  network: "bridge"
  per_rpc_timeout_seconds: 150
  add_host_gateway: true              # OV plugin reaches host:1933
