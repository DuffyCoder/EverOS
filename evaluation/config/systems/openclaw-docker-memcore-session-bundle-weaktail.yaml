# memory-core with the WEAK tail directive used by the reference
# openclaw-eval README. This is the configuration OV's paper most plausibly
# used to report memcore ≈ 35.65% on LoCoMo: the tail does not name the
# file_write tool, so the agent must infer from system prompts whether to
# persist memory — many sessions produce no memory at all.
#
# Used to verify that the dominant factor in the our-0.51 vs OV-0.36 delta
# is tail-directive strength, not architectural difference.
adapter: "openclaw-docker"

llm:
  provider: "openai"
  model: "doubao-seed-2-0-code-preview-260215"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  temperature: 0.0
  max_tokens: 1024

search:
  top_k: 6
  response_top_k: 5
  num_workers: 5
  max_inflight_queries_per_conversation: 1

answer:
  max_retries: 3
  max_concurrent: 4

openclaw:
  repo_path: "${OPENCLAW_REPO_PATH}"
  visibility_mode: "settled"
  retrieval_route: "search_then_get"
  backend_mode: "hybrid"               # BM25 + sophnet 1024-dim embeddings
  flush_mode: "session_bundle"
  answer_mode: "agent_local"
  memory_mode: "memory-core"
  agent_timeout_seconds: 90
  ingest_session_tail: "[remember what's said, keep existing memory]"
  agent_llm:
    provider_id: "sophnet"
    base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
    api: "openai-completions"
    api_key_env: "LLM_API_KEY"
    env_vars:
      - "LLM_API_KEY"
      - "LLM_BASE_URL"
      - "LLM_MODEL"
      - "SOPH_API_KEY"
      - "SOPH_EMBED_URL"
      - "SOPH_EMBED_EASYLLM_ID"
    model:
      id: "doubao-seed-2-0-code-preview-260215"
      name: "Doubao Seed 2.0 Code Preview (sophnet)"
      reasoning: false
      input: ["text"]
      cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      context_window: 128000
      max_tokens: 4096
  embedding:
    provider: "${OPENCLAW_EMBED_PROVIDER:sophnet}"
    model: "${OPENCLAW_EMBED_MODEL:text-embeddings}"
    api_key_env: "SOPH_API_KEY"
    base_url: "${SOPH_EMBED_URL:https://www.sophnet.com/api/open-apis/projects/4Q7Oxnq9F01FIBFSMfC8K3/easyllms/embeddings}"
    easyllm_id: "${SOPH_EMBED_EASYLLM_ID:1aKhWpzR3QKay9sZZ1TqWi}"
    output_dimensionality: 1024
  prompts:
    memory_mode: "native_compiled"
    flush_mode: "session_bundle"
    answer_mode: "shared"

openclaw_docker:
  image: "openclaw-eval:7da23c3-memory-core-0000000-slim"
  max_concurrent_containers: 4
  mem_limit: "2g"
  network: "bridge"
  per_rpc_timeout_seconds: 360
