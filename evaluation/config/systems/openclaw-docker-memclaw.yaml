# Stage 3 Phase 5 generality validation — second context-engine plugin.
#
# Plugin: @memclaw/memclaw-context-engine v0.9.61 (MIT, Stage 3 second
# onboarding 2026-05-05). Provides cortex-mem semantic memory + 10
# tools, ships kind: "context-engine" in openclaw.plugin.json.
#
# Wiring (same Phase 0-2 chain as hypercompositor):
#   memory_mode=memory-core             -> slots.memory = memory-core (bundled)
#   context_engine_mode=memclaw-context-engine -> slots.contextEngine = memclaw-context-engine
#
# Image build:
#   python openclaw-eval/harness/build.py --memory-plugin memory-core \
#     --install-spec '@memclaw/memclaw-context-engine@0.9.61' \
#     --install-plugin-id memclaw-context-engine
#
# Validated 2026-05-05: agent_run smoke ok=true in 19s, system_prompt_chars=24843
# (vs baseline ~150 without context engine), forced_terminate=false. Plugin
# requires config.toml at $HOME/.local/share/memclaw/ for production scoring;
# default scaffolding suffices for wiring smoke.
#
# As with hypercompositor, full LoCoMo scoring is gated on either upstream
# engine_import_history export OR operator-driven CLI replay (slow).
adapter: "openclaw-docker"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  temperature: 0.0
  max_tokens: 1024

search:
  top_k: 6
  response_top_k: 5
  num_workers: 2
  max_inflight_queries_per_conversation: 1

answer:
  max_retries: 2
  max_concurrent: 2

openclaw:
  repo_path: "${OPENCLAW_REPO_PATH}"
  visibility_mode: "settled"
  retrieval_route: "search_then_get"
  backend_mode: "hybrid"
  flush_mode: "shared_llm"
  answer_mode: "agent_local"
  memory_mode: "memory-core"
  context_engine_mode: "memclaw-context-engine"
  agent_timeout_seconds: 90
  agent_llm:
    provider_id: "sophnet"
    base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
    api: "openai-completions"
    api_key_env: "LLM_API_KEY"
    env_vars:
      - "LLM_API_KEY"
      - "LLM_BASE_URL"
      - "LLM_MODEL"
      - "SOPH_API_KEY"
      - "SOPH_EMBED_URL"
      - "SOPH_EMBED_EASYLLM_ID"
    model:
      id: "gpt-4.1-mini"
      name: "GPT 4.1 Mini (sophnet)"
      reasoning: false
      input: ["text"]
      cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      context_window: 128000
      max_tokens: 4096
  embedding:
    provider: "${OPENCLAW_EMBED_PROVIDER:sophnet}"
    model: "${OPENCLAW_EMBED_MODEL:text-embeddings}"
    api_key_env: "SOPH_API_KEY"
    base_url: "${SOPH_EMBED_URL:https://www.sophnet.com/api/open-apis/projects/4Q7Oxnq9F01FIBFSMfC8K3/easyllms/embeddings}"
    easyllm_id: "${SOPH_EMBED_EASYLLM_ID:1aKhWpzR3QKay9sZZ1TqWi}"
    output_dimensionality: 1024
  prompts:
    memory_mode: "native_compiled"
    flush_mode: "shared_llm"
    answer_mode: "shared"

openclaw_docker:
  image: "openclaw-eval:7da23c3-install-memclaw-context-engine-bb444b9-slim"
  max_concurrent_containers: 2
  mem_limit: "2g"
  network: "bridge"
  per_rpc_timeout_seconds: 120
