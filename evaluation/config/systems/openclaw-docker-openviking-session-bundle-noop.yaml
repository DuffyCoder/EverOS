# OV-only on LoCoMo via per-session bundle ingest.
#
# B2 wiring (noop memory slot, OV owns retrieval):
#   * memory_mode=noop disables OpenClaw memorySearch; agent has no
#     memory_search/memory_get tools. All recall goes through the OV
#     plugin's before_prompt_build hook.
#   * context_engine_mode=openviking puts the OV plugin in the
#     contextEngine slot. afterTurn captures every turn into the OV
#     backend regardless of message content; before_reset triggers
#     commitOVSession finalization between sessions.
#
# Ingest = per-session bundle replay through the bridge. Each session is
# bundled into a single agent_run call; the OV plugin's afterTurn hook
# fires and persists the turn in OV. Tail is empty because OV captures
# unconditionally — no need to cue the agent to write anything.
#
# Prerequisites at run time:
#   * OpenViking server running on the host at port 1933 (or wherever
#     OPENVIKING_BASE_URL points). The plugin uses
#     host.docker.internal:1933 inside the container; add_host_gateway
#     bridges that to the host machine.
#   * OPENVIKING_API_KEY exported in the host process env when running
#     the eval CLI; passed through via the agent_llm.env_vars whitelist.
adapter: "openclaw-docker"

llm:
  # provider stays "openai" — LLMProvider class only supports "openai"
  # type (sophnet is reached via base_url override, not a distinct provider).
  provider: "openai"
  model: "doubao-seed-2-0-pro-260215"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  temperature: 0.0
  max_tokens: 1024

search:
  top_k: 6
  response_top_k: 5
  num_workers: 5
  max_inflight_queries_per_conversation: 1

answer:
  max_retries: 3
  # Within one conv all QAs share ov_session_id and the in-container session
  # jsonl write lock. answer_stage guards this with a per-conv asyncio.Lock,
  # so cross-conv work is free to run up to ``max_concurrent``.
  #
  # ``auto`` = scan host env for LLM_API_KEY[_<N>] and size concurrency to
  # the pool, spreading load across independent per-key TPM/RPM limits.
  # Override to a specific int on RAM-tight hosts (each conv container is
  # ~1.5GB; OV server ~10GB; 16GB box safely runs 2-3 concurrent).
  max_concurrent: auto

openclaw:
  repo_path: "${OPENCLAW_REPO_PATH}"
  visibility_mode: "settled"
  retrieval_route: "search_then_get"
  backend_mode: "fts_only"            # OV owns retrieval; OpenClaw memorySearch off
  flush_mode: "session_bundle"
  answer_mode: "agent_local"
  memory_mode: "noop"
  context_engine_mode: "openviking"
  agent_timeout_seconds: 90
  # Empty tail: agent_run loop is skipped entirely for memory_mode=noop
  # (see ov_ingest below — OV is populated via direct HTTP, not afterTurn).
  ingest_session_tail: ""
  # Direct OV SDK ingest (mirrors openclaw-eval/import_to_ov.py).
  # Per LoCoMo session: create_session → add_message × N → commit_session
  # (telemetry=true) → poll task until completed. Bypasses the OV plugin's
  # afterTurn hook, which has a 20k-token commit threshold the smoke and
  # often the full conversation never reach. Headers must match the plugin
  # (OPENVIKING_ACCOUNT_ID + OPENVIKING_USER_ID env vars set on the host
  # process and forwarded via agent_llm.env_vars) so ingest writes to the
  # same tenant the plugin reads from at QA time.
  ov_ingest:
    base_url: "${OPENVIKING_INGEST_URL:http://127.0.0.1:1933}"
    api_key_env: "OPENVIKING_API_KEY"
    account_id: "default"
    # Fix #4: per-conv user_id isolation. Each LoCoMo conv writes to
    # and reads from ``viking://user/<conv_id>/memories/...``, matching
    # the official OpenViking benchmark ``import_to_ov.py`` pattern of
    # ``user_id=str(sample_id)``. Cross-conv name collisions (e.g. "John"
    # appearing in conv-41/43/47) no longer surface wrong-conv facts at
    # retrieval time. docker_adapter substitutes ``{conv_id}`` and pipes
    # it into the container as ``OPENVIKING_USER_ID`` env, which the OV
    # plugin reads as fallback for cfg.userId (see config.ts:209), so
    # QA-time queries hit the same tenant we wrote.
    user_id_template: "{conv_id}"
    # Fix #4 完整版: agent_id 也 per-conv,对齐官方 import_to_ov.py
    # (user_id=str(sample_id) AND agent_id=str(sample_id))。OV server
    # 同时写 user/<conv_id>/memories + agent/<conv_id>/memories。plugin
    # 端 agent_prefix 不读 env,仍然查 agent/default/memories(返 0 条),
    # 等同禁用 agent 这一路 — 跟官方实际行为一致。好处:agent/default
    # namespace 不再被 ingest 写入,跨 conv 的 agent 池彻底干净。
    agent_id_template: "{conv_id}"
    # Phase 2 / smoke3-global-settle-fix 数据: task_timeout=1800 让 21/32
    # locomo_2 task 被 client cancel,OV server 上这些 task 在 Stage 2/3 期间
    # 继续跑 (vectordb upsert/HNSW 仍在变化) → 脏读 retrieval。要真正
    # "ingest complete then answer" 必须让 client 等到 OV server 真完成
    # 所有 task。3 conv * ~23 task = 70 task @ ~55s/task = 64min wall clock,
    # 7200s (2hr) 给充足 margin。代价: smoke3 总时长 ~2hr (vs 60min),full10
    # 估 ~5-8hr。
    task_timeout_sec: 7200
    # Phase 2 (ingest-first, retrieve-after): per-conv settle 移到 pipeline
    # 全局 barrier。POST /api/v1/system/wait 让 OV server 自己 active poll
    # 所有 queue (embedding/semantic) 直到 idle 再返回,比固定 sleep 精确,
    # 且发生在所有 conv.add() 完成之后,真正实现 "ingest 全部结束才 retrieval"。
    # smoke3-t1800-settle1800 per-conv 实测: cat=1 单跳 acc -22pt (因 OV
    # consolidation 抽象化具体 fact 在 conv A settle 期间被并发 conv 干扰)。
    # 本配置走全局 barrier,期望 cat=1 恢复 + cat=2 多跳保持收益。
    # OV server 端 wait_processed 每 500ms poll is_all_complete; timeout_sec
    # 是 server 端 wait 的最大时长(超时 OV raise TimeoutError, client 端
    # 我们视为非致命 warning 继续 Stage 2)。http_buffer_sec 是客户端 aiohttp
    # 外层 timeout 的额外 margin,避免 client 比 server 早超时。
    post_add_settle:
      enabled: true
      # Settle hook 实测在 task=completed 之后 OV queue 已经 idle,instant
      # return (9ms in smoke3-global-settle-fix run)。timeout 是 cap,与
      # task_timeout 对齐避免 client-server timeout 不一致。
      timeout_sec: 7200
      http_buffer_sec: 60
  agent_llm:
    provider_id: "sophnet"
    base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
    api: "openai-completions"
    api_key_env: "LLM_API_KEY"
    # OpenClaw LLM-streaming idle timeout (seconds). Container default is
    # 60s (pi-embedded-runner DEFAULT_LLM_IDLE_TIMEOUT_MS). Under cross-conv
    # parallelism the provider chunk-gap regularly exceeds 60s → idle abort
    # → runner falls back to lastAssistant in payloads.ts (which, because
    # openclaw sessionStore aliases all per-QA session-ids to ONE UUID per
    # conv container, is actually the PRIOR turn's archived assistant
    # message), emitting prior QA's text as the current QA's reply and
    # silently polluting accuracy. 180s gives streaming enough headroom
    # while outer agent_timeout_seconds (90s) still caps per-turn wall
    # clock — so this is effectively "trust the outer cap, disable inner".
    idle_timeout_seconds: 180
    env_vars:
      - "LLM_API_KEY"
      - "LLM_BASE_URL"
      - "LLM_MODEL"
      - "SOPH_API_KEY"
      - "SOPH_EMBED_URL"
      - "SOPH_EMBED_EASYLLM_ID"
      - "OPENVIKING_BASE_URL"
      - "OPENVIKING_API_KEY"
      - "OPENVIKING_ACCOUNT_ID"
      - "OPENVIKING_USER_ID"
      # OPENVIKING_AGENT_PREFIX intentionally NOT forwarded — leaving it
      # unset makes the plugin's resolveAgentId fall through to "default",
      # matching the SDK ingest's no-X-OpenViking-Agent header behavior.
      # Setting a prefix here would shard storage by a synthesized agent
      # id and break ingest/retrieval alignment.
    model:
      id: "doubao-seed-2-0-code-preview-260215"
      name: "Doubao Seed 2.0 Code Preview (sophnet)"
      reasoning: false
      input: ["text"]
      cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      context_window: 128000
      max_tokens: 4096
      # Tier-A provider usage: yaml compat + docker _patch_streaming_usage_compat
      # (see openclaw/config_patches.py). Without both, metrics fall back to
      # session-transcript tiktoken (Tier B) in usage_metrics.py.
      compat:
        supportsUsageInStreaming: true
  prompts:
    memory_mode: "native_compiled"
    flush_mode: "session_bundle"
    answer_mode: "shared"

openclaw_docker:
  image: "ghcr.io/duffycoder/openclaw-eval-plugins:7da23c3-openviking-b7e6bcb-slim"
  max_concurrent_containers: 4
  mem_limit: ""
  network: "bridge"
  per_rpc_timeout_seconds: 360
  add_host_gateway: true              # OV plugin reaches host:1933
  # capture_container_logs: true      # default: write docker logs → eval_docker_container.log under each conv workspace before stop
  remove_container_on_stop: false     # omit docker --rm; after eval, ``docker logs <cid>`` still works until you ``docker rm`` the exited container
  # per_qa_isolation removed — see the parent commit's refactor note;
  # the shared-OV-session ingest path made workspace freezing obsolete.
