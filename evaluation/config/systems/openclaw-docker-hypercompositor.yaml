# Stage 3 Phase 5 — first real context-engine plugin (R2-routed prototype, docker mode).
#
# Plugin: @psiclawops/hypercompositor (Apache-2.0, Stage 3 audit selection
# 2026-05-02 — see docs/superpowers/specs/2026-05-02-stage3-phase5-plugin-audit.md).
# Internal storage: @psiclawops/hypermem (sqlite-vec) installed transitively
# via npm. NOT a standalone openclaw plugin — only hypercompositor binds a slot.
#
# Wiring (Phase 0-2 chain):
#   memory_mode=memory-core             -> slots.memory = memory-core (bundled)
#   context_engine_mode=hypercompositor -> slots.contextEngine = hypercompositor
#
# Image build:
#   python openclaw-eval/harness/build.py --memory-plugin memory-core \
#     --install-spec '@psiclawops/hypercompositor@0.9.6' \
#     --install-plugin-id hypercompositor
#
# IMPORTANT: scorecard from this config is "wiring/prototype, NOT
# comparable" with the Stage 1/2 memory-plugin matrix. R2 routing
# (conv-level session_id) leaks state across QA per design note caveats.
adapter: "openclaw-docker"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  temperature: 0.0
  max_tokens: 1024

search:
  top_k: 6
  response_top_k: 5
  num_workers: 2
  max_inflight_queries_per_conversation: 1

answer:
  max_retries: 2
  max_concurrent: 2

openclaw:
  repo_path: "${OPENCLAW_REPO_PATH}"
  visibility_mode: "settled"
  retrieval_route: "search_then_get"
  backend_mode: "hybrid"
  flush_mode: "shared_llm"
  answer_mode: "agent_local"
  memory_mode: "memory-core"
  context_engine_mode: "hypercompositor"
  agent_timeout_seconds: 90
  agent_llm:
    provider_id: "sophnet"
    base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
    api: "openai-completions"
    api_key_env: "LLM_API_KEY"
    env_vars:
      - "LLM_API_KEY"
      - "LLM_BASE_URL"
      - "LLM_MODEL"
      - "SOPH_API_KEY"
      - "SOPH_EMBED_URL"
      - "SOPH_EMBED_EASYLLM_ID"
    model:
      id: "gpt-4.1-mini"
      name: "GPT 4.1 Mini (sophnet)"
      reasoning: false
      input: ["text"]
      cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      context_window: 128000
      max_tokens: 4096
  embedding:
    provider: "${OPENCLAW_EMBED_PROVIDER:sophnet}"
    model: "${OPENCLAW_EMBED_MODEL:text-embeddings}"
    api_key_env: "SOPH_API_KEY"
    base_url: "${SOPH_EMBED_URL:https://www.sophnet.com/api/open-apis/projects/4Q7Oxnq9F01FIBFSMfC8K3/easyllms/embeddings}"
    easyllm_id: "${SOPH_EMBED_EASYLLM_ID:1aKhWpzR3QKay9sZZ1TqWi}"
    output_dimensionality: 1024
  prompts:
    memory_mode: "native_compiled"
    flush_mode: "shared_llm"
    answer_mode: "shared"

# Image carries the installed hypercompositor (kind: context-engine).
openclaw_docker:
  image: "openclaw-eval:7da23c3-install-hypercompositor-5bace1f-slim"
  max_concurrent_containers: 2
  mem_limit: "2g"
  network: "bridge"
  per_rpc_timeout_seconds: 120
