# EverMemOS System Configuration

name: "mempalace"
version: "1.0"
description: "MemPalace"

adapter: "mempalace"

# LLM configuration
llm:
  provider: "openai"
  model: "gpt-4.1-mini"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  max_tokens: 16384

add:
  build_closets: true

search:
  mode: "agentic" # agentic | lightweight
  top_k: 10
  response_top_k: 10
  use_closet_boost: false
  use_keyword_predicate_boost: true
  # When mode="lightweight", the search method defaults to "bm25_only".
  # Uncomment and set the following to override:
  # lightweight_search_mode: "hybrid"   # BM25 + Embedding + RRF fusion
  # lightweight_search_mode: "emb_only" # Only Embedding search

