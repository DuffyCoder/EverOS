# memory-core (OpenClaw default) on LoCoMo via per-message agent_run replay.
#
# Ingest semantics — A2 (forced flush, distill-quality upper bound):
#   * No framework-side LLM. flush_mode=agent_replay tells the adapter
#     to skip ingest-time markdown writing entirely. Ingest = the
#     OpenClaw agent chats through every LoCoMo conv message, accumulating
#     short-term in jsonl, and OpenClaw's own `runMemoryFlushIfNeeded`
#     fires when the soft threshold is crossed.
#   * compaction_overrides drops softThresholdTokens to 90000 so the
#     flush threshold (= contextWindow - reserveTokensFloor - softThreshold
#     = 128000 - 20000 - 90000 = 18000 tokens) is reachable within
#     a LoCoMo conversation (~30-50k accumulated jsonl tokens).
#     This IS a deliberate deviation from OpenClaw production defaults —
#     production memory-core targets long-running chats where the default
#     104k threshold makes sense. LoCoMo is too short to trigger natural
#     flush, so the bench dial-in is documented here.
#
# Image: built by openclaw-eval/harness/build.py with --memory-plugin
# memory-core (no context-engine). After Phase 1+2 changes the eval-base
# layer needs rebuild because entrypoint.sh + template.json hash changed;
# follow build.py output's tag.
adapter: "openclaw-docker"

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
  temperature: 0.0
  max_tokens: 1024

search:
  top_k: 6
  response_top_k: 5
  num_workers: 5
  max_inflight_queries_per_conversation: 1

answer:
  max_retries: 3
  max_concurrent: 4

openclaw:
  repo_path: "${OPENCLAW_REPO_PATH}"
  visibility_mode: "settled"
  retrieval_route: "search_then_get"
  backend_mode: "hybrid"
  flush_mode: "agent_replay"          # Phase 2: skip fake LLM flush
  answer_mode: "agent_local"
  memory_mode: "memory-core"
  agent_timeout_seconds: 90
  # Forced-flush dial-in for LoCoMo. softThresholdTokens=90000 brings
  # the flush trigger threshold down to ~18k tokens — the agent's
  # accumulated session context crosses this around turn 50-80 of a
  # 380-message LoCoMo conversation (system ~10k + each turn adds
  # ~150 tokens of msg+reply). Native flush fires ONCE per compaction
  # cycle (hasAlreadyFlushedForCurrentCompaction guard), so memory
  # captures roughly the first 50-80 turns of context. This is the
  # production gating behavior; getting later turns into memory would
  # require an explicit flush trigger (option γ from the design notes,
  # implementable as a new bridge command).
  #
  # NOTE: --smoke mode passes only 5 messages, never crosses 18k, so
  # smoke runs produce empty memory and ~0 scores. That is expected
  # and tests wiring, not retrieval. Full LoCoMo runs (380 msgs/conv)
  # will fire flush as designed.
  compaction_overrides:
    enabled: true
    soft_threshold_tokens: 90000
    reserve_tokens_floor: 20000
  agent_llm:
    provider_id: "sophnet"
    base_url: "${LLM_BASE_URL:https://www.sophnet.com/api/open-apis/v1}"
    api: "openai-completions"
    api_key_env: "LLM_API_KEY"
    env_vars:
      - "LLM_API_KEY"
      - "LLM_BASE_URL"
      - "LLM_MODEL"
      - "SOPH_API_KEY"
      - "SOPH_EMBED_URL"
      - "SOPH_EMBED_EASYLLM_ID"
    model:
      id: "gpt-4.1-mini"
      name: "GPT 4.1 Mini (sophnet)"
      reasoning: false
      input: ["text"]
      cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
      context_window: 128000
      max_tokens: 4096
  embedding:
    provider: "${OPENCLAW_EMBED_PROVIDER:sophnet}"
    model: "${OPENCLAW_EMBED_MODEL:text-embeddings}"
    api_key_env: "SOPH_API_KEY"
    base_url: "${SOPH_EMBED_URL:https://www.sophnet.com/api/open-apis/projects/4Q7Oxnq9F01FIBFSMfC8K3/easyllms/embeddings}"
    easyllm_id: "${SOPH_EMBED_EASYLLM_ID:1aKhWpzR3QKay9sZZ1TqWi}"
    output_dimensionality: 1024
  prompts:
    memory_mode: "native_compiled"
    flush_mode: "agent_replay"
    answer_mode: "shared"

# Image tag is filled in by Phase 5's build.py output. Format:
# openclaw-eval:<openclaw_sha>-memory-core-<rev>-slim
openclaw_docker:
  image: "openclaw-eval:7da23c3-memory-core-0000000-slim"
  max_concurrent_containers: 4
  mem_limit: "2g"
  network: "bridge"
  per_rpc_timeout_seconds: 150
