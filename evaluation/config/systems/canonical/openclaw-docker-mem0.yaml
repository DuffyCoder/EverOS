extends: "_bases/openclaw-docker.yaml"

search:
  top_k: 6
  response_top_k: 5
  num_workers: 5

answer:
  max_concurrent: 4

openclaw:
  backend_mode: "fts_only"
  flush_mode: "disabled"
  memory_mode: "mem0"
  agent_timeout_seconds: 180
  agent_llm:
    env_vars:
      - "LLM_API_KEY"
      - "LLM_BASE_URL"
      - "LLM_MODEL"
      - "OPENCLAW_PROMPT_STYLE"

openclaw_docker:
  image: "openclaw-eval:7da23c3-mem0-46c0029-slim"
  max_concurrent_containers: 4
  # The Mem0 sidecar includes ChromaDB and MiniLM.
  mem_limit: "3g"
  # Allow for the sidecar's cold-start initialization.
  per_rpc_timeout_seconds: 240
