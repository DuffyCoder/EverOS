name: "memu"
version: "1.0"
description: "Memu Memory Management System"

adapter: "memu"

# MemU is integrated through its REST API without the Python SDK.
# Reference: https://memu.pro/docs#memory-apis
api_key: "${MEMU_API_KEY}"
base_url: "https://api.memu.so"
max_retries: 5

agent_id: "evaluation_agent_04"
agent_name: "Memory Evaluation Assistant"

task_check_interval: 15
task_timeout: 4800

num_workers: 1

dataset_overrides:
  locomo:
    # Kept explicit for compatibility with the historical preset.
    num_workers: 1

# Compatibility-only: the current adapter does not consume this field.
min_similarity: 0.3

llm:
  provider: "openai"
  model: "${LLM_MODEL}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 32768

search:
  top_k: 20

answer:
  max_retries: 3
