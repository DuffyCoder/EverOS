name: "memos"
version: "1.0"
description: "Memos"

adapter: "memos"

api_url: "https://memos.memtensor.cn/api/openmem/v1"
api_key: "${MEMOS_KEY}"
batch_size: 10
max_retries: 5

# Compatibility-only: the current adapter does not consume this field.
request_interval: 0.1

# Serialize conversations to stay within the 10 requests/second API limit.
num_workers: 1

dataset_overrides:
  longmemeval:
    batch_size: 6  # LongMemEval has large data, use smaller batch_size

# Allow the asynchronous remote service to finish indexing before search.
post_add_wait_seconds: 180

llm:
  provider: "openai"
  model: "${LLM_MODEL}"
  api_key: "${LLM_API_KEY}"
  base_url: "${LLM_BASE_URL:https://openrouter.ai/api/v1}"
  temperature: 0
  max_tokens: 32768

search:
  top_k: 20

answer:
  max_retries: 3
